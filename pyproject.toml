[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clmp"
version = "4.0.0"
description = "CLI Movie Package — Turn MP4 videos into colored ASCII terminal animations with audio"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.8"
authors = [
    { name = "CLMP Contributors" },
]
keywords = ["ascii", "video", "terminal", "cli", "movie", "player", "animation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Terminals",
]
dependencies = [
    "opencv-python",
    "numpy",
    "sounddevice",
]

[project.scripts]
clmp = "clmp.cli:main"

[project.urls]
Homepage = "https://github.com/1ypi/clmp"
Repository = "https://github.com/1ypi/clmp"
Issues = "https://github.com/1ypi/clmp/issues"

[tool.hatch.build.targets.wheel]
packages = ["clmp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "*.mp4",
    "*.clmp",
    "*.mkv",
    "*.avi",
    "*.mov"
]
